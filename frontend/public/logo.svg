<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="60" rx="8" fill="#1e40af"/>
  
  <!-- Cement bag icon -->
  <g transform="translate(15, 10)">
    <!-- Bag shape -->
    <path d="M8 8 L8 25 Q8 28 11 28 L29 28 Q32 28 32 25 L32 8 Q32 5 29 5 L11 5 Q8 5 8 8 Z" 
          fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
    <!-- Bag top -->
    <rect x="6" y="3" width="28" height="4" rx="2" fill="#f59e0b"/>
    <!-- SOL text on bag -->
    <text x="20" y="18" font-family="Arial, sans-serif" font-size="8" font-weight="bold" 
          text-anchor="middle" fill="#1e40af">SOL</text>
  </g>
  
  <!-- Company name -->
  <text x="55" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" 
        text-anchor="start" fill="white">SOL CEMENT</text>
  
  <!-- Tagline -->
  <text x="55" y="42" font-family="Arial, sans-serif" font-size="9" 
        text-anchor="start" fill="#fbbf24">Build The Future</text>
  
  <!-- Decorative elements -->
  <circle cx="175" cy="20" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="185" cy="25" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="180" cy="35" r="2.5" fill="#fbbf24" opacity="0.7"/>
</svg>
